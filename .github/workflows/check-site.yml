name: Verify published site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-ui.js
        env:
          SMOKE_ROOT: .
          SMOKE_BASE: /
      - run: node scripts/smoke-sanma.js
        env:
          SMOKE_ROOT: .
          SMOKE_BASE: /
      - run: node scripts/smoke-nearby.js
        env:
          SMOKE_ROOT: .
          SMOKE_BASE: /
      - run: node scripts/smoke-save-payload.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mahjong-mania-preview
          path: mahjong-jewel-*.png
      - run: node scripts/smoke-portrait-discard.js
      - run: node scripts/smoke-blue-design.js
        env:
          SMOKE_ROOT: .
          BLUE_SCREENSHOTS: /tmp/houseki-blue-screenshots
      - run: node scripts/smoke-win-highlights.js
        env:
          SMOKE_ROOT: .
          WIN_SCREENSHOT: /tmp/houseki-win-highlights.png
      - run: node scripts/smoke-cpu-levels.js
        env:
          SMOKE_ROOT: .

      - name: Chinchiro WebGL and pass-and-play regression
        run: |
          python3 -m http.server 8878 --bind 127.0.0.1 > /tmp/chinchiro-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/smoke-chinchiro.js

      - name: Nearby Sanma and Chinchiro multiplayer
        run: |
          python3 -m http.server 8879 --bind 127.0.0.1 > /tmp/tables-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          CONNECTION=near GAME=sanma node scripts/smoke-table-online.js
          CONNECTION=near GAME=chinchiro node scripts/smoke-table-online.js
