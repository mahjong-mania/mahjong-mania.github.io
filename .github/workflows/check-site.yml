name: Verify published site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-ui.js
        env:
          SMOKE_ROOT: .
          SMOKE_BASE: /
      - run: node scripts/smoke-sanma.js
        env:
          SMOKE_ROOT: .
          SMOKE_BASE: /
      - run: node scripts/smoke-nearby.js
        env:
          SMOKE_ROOT: .
          SMOKE_BASE: /
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mahjong-mania-preview
          path: mahjong-jewel-*.png
